<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASTY - App Store shots</title>
<style>
  :root{
    --felt1:#256b46; --felt2:#0e3421;
    --cream:#fbf7ee; --gold:#f4c542; --ink:#2b2118;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    color:var(--cream);
    background:radial-gradient(120% 95% at 50% 0%,var(--felt1),var(--felt2) 78%);
    background-attachment:fixed;
    min-height:100vh;
    padding:36px 16px 64px;
  }
  header{text-align:center;margin-bottom:8px}
  .sign{
    display:inline-block;
    background:linear-gradient(160deg,#1f7d40,#0d3d20);
    border:3px solid var(--cream);
    border-radius:14px;
    padding:14px 30px;
    box-shadow:0 8px 22px rgba(0,0,0,.4);
  }
  .sign b{
    font-size:clamp(28px,7vw,44px);
    letter-spacing:.08em;
    color:var(--cream);
    text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  header p{
    color:#cfe6d6;
    font-size:15px;
    letter-spacing:.03em;
    margin:18px auto 0;
    max-width:480px;
  }
  .grid{
    max-width:1180px;
    margin:40px auto 0;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:36px 28px;
    justify-items:center;
  }
  figure{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:320px;
  }
  .shot{
    width:100%;
    max-width:280px;
    border-radius:28px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 6px rgba(0,0,0,.25);
    background:#0e3421;
  }
  .shot img{
    display:block;
    width:100%;
    max-width:100%;
    height:auto;
  }
  figcaption{
    margin-top:14px;
    text-align:center;
    font-size:15px;
    color:var(--cream);
    line-height:1.4;
  }
  figcaption .tag{
    display:block;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:4px;
  }
  footer{
    text-align:center;
    margin-top:56px;
    color:#a9c8b6;
    font-size:12px;
    letter-spacing:.05em;
  }
  footer a{color:var(--gold)}
</style>
</head>
<body>
  <header>
    <div class="sign"><b>NASTY</b></div>
    <p>App Store shots - v0.65, real public launch set.<br>
      Golf tees, a real board, thirty years of house rules - now free to play, with optional cosmetics in the Shop.</p>
  </header>

  <div class="grid">
    <figure>
      <div class="shot"><img src="menu.png" alt="Main menu, signed out"></div>
      <figcaption><span class="tag">Menu</span>Players, game type, a rules tip, and Online play gated until you sign in</figcaption>
    </figure>

    <figure>
      <div class="shot"><img src="board4.png" alt="4-player board mid-game"></div>
      <figcaption><span class="tag">4-Player</span>Tees racing around the board, cards in hand</figcaption>
    </figure>

    <figure>
      <div class="shot"><img src="board6.png" alt="6-player teams board mid-game, Sunset palette equipped"></div>
      <figcaption><span class="tag">6-Player Teams</span>Partners sit across the board - ten tees moving at once, shown here with the Sunset palette</figcaption>
    </figure>

    <figure>
      <div class="shot"><img src="leaderboard.png" alt="Shared leaderboard"></div>
      <figcaption><span class="tag">Leaderboard</span>Points for beating tougher opponents, tracked across every phone</figcaption>
    </figure>

    <figure>
      <div class="shot"><img src="shop.png" alt="Shop showing the credit packs and other cosmetics"></div>
      <figcaption><span class="tag">Shop</span>Free to play - credits are earned by playing, or bought outright. Purely cosmetic, never required</figcaption>
    </figure>
  </div>

  <footer>
    NASTY - <a href="https://nastyboardgame.com/">nastyboardgame.com</a>
  </footer>
</body>
</html>
